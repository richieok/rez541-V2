# Overlay for compose.yml that swaps MongoDB Atlas for a throwaway local
# MongoDB, so the booking system can be tested with made-up data.
#
# Start the dev stack with the fake database:
#   ./dev-fakedb.sh
#   (or: docker compose -f compose.yml -f compose.fakedb.yml up --build --watch)
#
# Seed it with fake spa bookings, the room catalogue, and site settings:
#   docker compose -f compose.yml -f compose.fakedb.yml exec backend npm run seed:spa
#   docker compose -f compose.yml -f compose.fakedb.yml exec backend npm run seed:rooms
#   docker compose -f compose.yml -f compose.fakedb.yml exec backend npm run seed:site-settings
#
# Data persists in the mongo-fake-data volume between runs. To start clean:
#   docker compose -f compose.yml -f compose.fakedb.yml down -v

# Cap json-file log growth so long-running containers can't fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongo:
    image: mongo:7
    container_name: mongo_fake
    logging: *default-logging
    ports:
      # Exposed on the host so you can inspect data with mongosh / Compass:
      #   mongodb://localhost:27017/rez541db
      - 27017:27017
    volumes:
      - mongo-fake-data:/data/db
    networks:
      - cosmosnet

  # Web UI for browsing the fake database: http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo_express_fake
    logging: *default-logging
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      # Local throwaway data only, so no login screen.
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    networks:
      - cosmosnet

  backend:
    environment:
      # Overrides the Atlas connection string built in backend/initDB.js
      - DB_URI=mongodb://mongo:27017/rez541db
    depends_on:
      - mongo

volumes:
  mongo-fake-data:
