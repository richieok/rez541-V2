# Container logs ship to CloudWatch Logs (log group per service) using the
# EC2 instance role. The log groups are created with a retention policy by
# cfn-templates/rez541-traefik.yml; awslogs-create-group is a fallback so the
# stack still boots if they don't exist yet.
x-awslogs-options: &awslogs-options
  awslogs-region: us-east-1
  awslogs-create-group: "true"

services:
  traefik:
    image: traefik:v3.6.1
    environment:
      - DOCKER_API_VERSION=1.44
    container_name: traefik
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /rez541/traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=admin@residence541.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cosmosnet

  backend:
    build: ./backend
    container_name: backend
    working_dir: /app
    command: npm run start
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /rez541/backend
    environment:
      - PORT=4000
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TEST=RED_LIGHT
      - AWS_BUCKET=rez541bucket
      - CLOUD=aws
      - SSM_PARAMETER_PATH=/rez541/env/
      - REGION=us-east-1
      - DOMAIN=residence541.com
    networks:
      - cosmosnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`residence541.com`) && PathPrefix(`/api/`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=4000

  frontend:
    build: ./frontend
    container_name: frontend
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /rez541/frontend
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - cosmosnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`residence541.com`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000

networks:
  cosmosnet:
    driver: bridge

volumes:
  letsencrypt:
